name: sync-upstream

# ── 每天把上游 chasey-dev/immortalwrt-mt798x-rebase 的 25.12 合进来 ────────
#
# 分支模型（本仓库是上游的 fork）：
#   main    = 上游镜像，只做快进，内容永远等于上游 25.12
#   product = 我们的树；main 合进来，冲突在这里解
#
# 流程：
#   ① fetch 上游 25.12；
#   ② main 快进到上游 tip（不是后代就报错停下，防止被 force-push 搞乱）；
#   ③ 只有上游有新提交时，才把 main merge 进 product；
#   ④ 冲突：一个字节都不推，开/更新 issue，列出冲突文件和上游提交范围。

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京 04:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只试不合（不推送）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: chasey-dev/immortalwrt-mt798x-rebase
  UPSTREAM_BRANCH: '25.12'
  MIRROR_BRANCH: main
  PRODUCT_BRANCH: product

jobs:
  sync:
    name: 上游 → main（快进）→ product（合并）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出 product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉上游并快进 main
        id: up
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          NEW=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags origin "${MIRROR_BRANCH}"
          OLD=$(git rev-parse "origin/${MIRROR_BRANCH}")
          echo "main: ${OLD}"
          echo "上游: ${NEW}"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交，收工"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$OLD" "$NEW"; then
            echo "::error::上游 ${UPSTREAM_BRANCH} 不是 main 的后代（可能被 force-push），需要人工处理"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "range=${OLD:0:10}..${NEW:0:10}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run: 跳过 main 快进（下面只试合并）"
            exit 0
          fi
          git push origin "${NEW}:refs/heads/${MIRROR_BRANCH}"

      - name: main 合进 product
        if: steps.up.outputs.changed == 'true'
        id: merge
        env:
          NEW: ${{ steps.up.outputs.new }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "${MIRROR_BRANCH}" || true
          if git merge --no-ff --no-edit -m "merge main ← 上游 ${UPSTREAM_BRANCH} [skip ci]" "$NEW"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ 干净地合进来了"
          else
            git ls-files -u | awk '{print $4}' | sort -u > /tmp/conflicts.txt || true
            git merge --abort || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "❌ 冲突 $(wc -l < /tmp/conflicts.txt) 个文件"
          fi

      - name: 冲突 → 开 issue 并停下
        if: steps.up.outputs.changed == 'true' && steps.merge.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          RANGE="${{ steps.up.outputs.range }}"
          {
            echo "自动同步上游时，**${RANGE}** 这段和 product 冲突了。"
            echo
            echo "- 上游范围：https://github.com/${UPSTREAM_REPO}/compare/${RANGE}"
            echo "- 冲突文件（最多 40 个）："
            echo '```'
            head -40 /tmp/conflicts.txt 2>/dev/null || echo "(没能列出)"
            echo '```'
            echo
            echo "**这次什么都没推**：main 已经快进到上游，product 保持原样。"
            echo
            echo "手工处理："
            echo '```sh'
            echo "git fetch origin main"
            echo "git checkout product"
            echo "git merge origin/main      # 解冲突"
            echo "git push origin product"
            echo '```'
          } > /tmp/issue.md
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --json number,title --jq '.[] | select(.title|startswith("上游同步冲突")) | .number' | head -1)
          if [ -n "${NUM:-}" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "上游同步冲突" --body-file /tmp/issue.md
          fi
          exit 1

      - name: 推送 product
        if: steps.up.outputs.changed == 'true' && steps.merge.outputs.ok == 'true' && inputs.dry_run != true
        run: git push origin "HEAD:${PRODUCT_BRANCH}"
